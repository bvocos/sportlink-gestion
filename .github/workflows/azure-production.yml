name: Validar y publicar en Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: 9.0.x
  NODE_VERSION: 22
  API_PROJECT: backend/src/Api/Api.csproj
  TEST_PROJECT: backend/tests/Api.Tests/Api.Tests.csproj
  PUBLISH_PATH: ${{ github.workspace }}/publish

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Restaurar backend
        run: dotnet restore CespedSintetico.sln

      - name: Probar backend
        run: dotnet test ${{ env.TEST_PROJECT }} --configuration Release --no-restore

      - name: Publicar aplicación completa
        run: dotnet publish ${{ env.API_PROJECT }} --configuration Release --no-restore --output "${{ env.PUBLISH_PATH }}"

      - name: Verificar frontend publicado
        shell: bash
        run: test -f "${{ env.PUBLISH_PATH }}/wwwroot/index.html"

      - name: Desplegar en Azure App Service
        if: github.ref == 'refs/heads/main'
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ env.PUBLISH_PATH }}
